name: Build Multi-Platform Distribution

# 触发条件：推送 tag 或手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 第一阶段：在 Mac 上构建 jar（DJL 全平台通用 jar）
  build-jar:
    name: Build JAR (macOS-14)
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'

      - name: Build web demo
        # 在 Mac 上 mvn package（已验证 Mac 跑通），生成跨平台 jar
        run: cd smartjavaai-web-demo && mvn -B clean package -DskipTests -Dgpg.skip=true

      - name: Upload JAR for other platforms to use
        uses: actions/upload-artifact@v4
        with:
          name: smartjavaai-web-demo-jar
          path: smartjavaai-web-demo/target/smartjavaai-web-demo.jar
          retention-days: 1

  # 第二阶段：3 平台各自用预编译的 jar 做分发包
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: build-jar
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64

    steps:
      - name: Checkout code (for scripts and workflow files)
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'

      - name: Download prebuilt JAR
        uses: actions/download-artifact@v4
        with:
          name: smartjavaai-web-demo-jar
          path: dist/app

      - name: Prepare distribution directory
        shell: bash
        run: |
          # 创建自定义 JRE
          jlink \
            --add-modules ALL-MODULE-PATH \
            --strip-debug \
            --no-man-pages \
            --no-header-files \
            --output dist/runtime

          # 复制模型
          mkdir -p dist/models
          cp -R smartjavaai-web-demo/models/* dist/models/

      - name: Pre-load DJL native libs (optional, skip on failure)
        shell: bash
        continue-on-error: true
        run: |
          cd dist
          mkdir -p logs

          # 启动 demo（后台）
          nohup ./runtime/bin/java \
            -Xmx4g \
            -Dloader.main=cn.smartjavaai.web.WebDemoApplication \
            -Dai.djl.default_engine=OnnxRuntime \
            -Dloader.path=./models \
            -cp ./app/smartjavaai-web-demo.jar \
            org.springframework.boot.loader.launch.PropertiesLauncher > logs/warmup.log 2>&1 &
          WARMUP_PID=$!

          # 等启动 + 触发 OCR
          SUCCESS=false
          for i in {1..30}; do
            sleep 3
            if curl -s --max-time 5 http://localhost:8080/api/health > /dev/null 2>&1; then
              echo "服务启动，触发 OCR 加载模型..."
              echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==" | base64 -d > /tmp/warmup.png
              curl -s --max-time 60 -X POST \
                -F "file=@/tmp/warmup.png" \
                http://localhost:8080/api/ocr/recognize > /dev/null 2>&1 || true
              sleep 5
              SUCCESS=true
              break
            fi
          done

          kill $WARMUP_PID 2>/dev/null || true
          sleep 2
          kill -9 $WARMUP_PID 2>/dev/null || true

          if [ "$SUCCESS" = true ] && [ -d "$HOME/smartjavaai_cache" ]; then
            echo "✓ 预置 native libs"
            mkdir -p dist/natives
            cp -R "$HOME/smartjavaai_cache"/* dist/natives/
            du -sh dist/natives
          else
            echo "⚠ 未下载到 native lib（用户首次启动需联网）"
          fi

      - name: Create start scripts
        shell: bash
        run: |
          # macOS / Linux
          cat > dist/start.sh << 'EOF'
          #!/bin/bash
          DIR="$(cd "$(dirname "$0")" && pwd)"
          RUNTIME="$DIR/runtime"
          APP_JAR="$DIR/app/smartjavaai-web-demo.jar"
          LOG_DIR="$DIR/logs"

          JAVA_OPTS="-Xmx4g -Dfile.encoding=UTF-8"

          # 预置 DJL native libs（首次启动跳过联网下载）
          SMARTJAVAAI_CACHE="$HOME/smartjavaai_cache"
          if [ ! -d "$SMARTJAVAAI_CACHE/pytorch" ] && [ -d "$DIR/natives" ]; then
              echo "🛰  首次启动: 预置 DJL native libs 到 $SMARTJAVAAI_CACHE"
              mkdir -p "$SMARTJAVAAI_CACHE"
              cp -R "$DIR/natives"/* "$SMARTJAVAAI_CACHE/" && \
                  echo "✓ Native libs 预置完成" || \
                  echo "⚠ 预置失败（首次启动可能需要联网）"
          fi

          echo "========================================"
          echo "  SmartJavaAI OCR & 查重 工具"
          echo "  启动中..."
          echo "========================================"
          echo ""
          echo "  📁 模型目录: $DIR/models"
          echo "  📝 日志: $LOG_DIR/run.log"
          echo "  🌐 访问: http://localhost:8080"
          echo ""
          echo "  按 Ctrl+C 停止服务"
          echo ""

          mkdir -p "$LOG_DIR"
          "$RUNTIME/bin/java" $JAVA_OPTS \
              -Dloader.main=cn.smartjavaai.web.WebDemoApplication \
              -Dai.djl.default_engine=OnnxRuntime \
              -Dloader.path="$DIR/models" \
              -cp "$APP_JAR" \
              org.springframework.boot.loader.launch.PropertiesLauncher
          EOF
          chmod +x dist/start.sh

          # Windows
          cat > dist/start.bat << 'EOF'
          @echo off
          chcp 65001 >nul

          set DIR=%~dp0
          set RUNTIME="%DIR%runtime"
          set APP_JAR="%DIR%app\smartjavaai-web-demo.jar"
          set LOG_DIR="%DIR%logs"

          set JAVA_OPTS=-Xmx4g -Dfile.encoding=UTF-8

          REM 预置 DJL native libs
          set SMARTJAVAAI_CACHE=%USERPROFILE%\smartjavaai_cache
          if not exist "%SMARTJAVAAI_CACHE%\pytorch" (
              if exist "%DIR%natives" (
                  echo 预置 DJL native libs 到 %SMARTJAVAAI_CACHE%...
                  if not exist "%SMARTJAVAAI_CACHE%" mkdir "%SMARTJAVAAI_CACHE%"
                  xcopy /E /I /Y "%DIR%natives" "%SMARTJAVAAI_CACHE%"
                  echo Native libs 预置完成
              )
          )

          echo ========================================
          echo   SmartJavaAI OCR ^ 查重 工具
          echo   启动中...
          echo ========================================
          echo.
          echo   模型目录: %DIR%models
          echo   日志: %LOG_DIR%\run.log
          echo   访问: http://localhost:8080
          echo.
          echo   按 Ctrl+C 停止服务
          echo.

          if not exist "%LOG_DIR%" mkdir "%LOG_DIR%"
          %RUNTIME%\bin\java.exe %JAVA_OPTS% ^
              -Dloader.main=cn.smartjavaai.web.WebDemoApplication ^
              -Dai.djl.default_engine=OnnxRuntime ^
              -Dloader.path="%DIR%models" ^
              -cp "%APP_JAR%" ^
              org.springframework.boot.loader.launch.PropertiesLauncher

          pause
          EOF

      - name: Create README
        shell: bash
        run: |
          cat > dist/README.txt << 'EOF'
          ═══════════════════════════════════════════════════════
            SmartJavaAI OCR & 查重工具  v0.5.0
            平台: ${{ matrix.platform }}
          ═══════════════════════════════════════════════════════

          🚀 启动方法：
            Windows:   双击 start.bat
            Mac/Linux: 双击 start.sh，或在终端执行 ./start.sh

          🌐 启动后访问：
            http://localhost:8080

          📋 系统要求：
            - ${{ matrix.os == 'windows-latest' && 'Windows 10/11 64位' || (matrix.os == 'macos-14' && 'macOS 12+ Apple Silicon (M1/M2/M3)' || 'Linux x86_64') }}
            - 无需预装 Java！JRE 已内置
            - 至少 4GB 内存
            - 首次启动可能需要联网（DJL 下载 native libs）

          💡 功能：
            - 通用 OCR 文字识别（中文/英文/数字）
            - 文字位置识别（带置信度）
            - 身份证识别（含字段校验）
            - 车牌识别（带正则校验）
            - 图片查重 / PS 检测（aHash + pHash 算法）

          📁 目录结构：
            runtime/      自定义 JRE（无需安装 Java）
            app/         主程序 jar
            models/      PaddleOCR 模型文件
            natives/     预置的 native libs（如有）
            logs/        运行日志
            start.bat    Windows 启动脚本
            start.sh     Mac/Linux 启动脚本

          ❓ 故障排查：
            1. 端口 8080 被占用 → 编辑 start.sh/bat，修改 8080 为其他端口
            2. 模型加载失败 → 检查 models/ 目录是否完整
            3. 首次启动慢 → DJL 在下载 native libs（~200MB），需要联网
            4. 其他问题 → 查看 logs/run.log
          EOF

      - name: Clean up build artifacts
        shell: bash
        run: |
          rm -rf dist/logs
          echo "清理完成"

      - name: Package as zip
        # Mac/Linux 用 zip 命令；Windows runner 默认 PowerShell 用 Compress-Archive
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            # Windows PowerShell (default shell) - 用 Compress-Archive
            powershell -Command "Compress-Archive -Path 'dist/*' -DestinationPath 'SmartJavaAI-WebDemo-${{ github.ref_name || 'latest' }}-${{ matrix.platform }}.zip' -Force"
          else
            # Mac / Linux
            cd dist
            zip -qr ../SmartJavaAI-WebDemo-${{ github.ref_name || 'latest' }}-${{ matrix.platform }}.zip .
            cd ..
          fi
          ls -lh *.zip

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartJavaAI-WebDemo-${{ matrix.platform }}
          path: SmartJavaAI-WebDemo-*.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -lh artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*.zip
          generate_release_notes: true
          draft: false
          prerelease: false
